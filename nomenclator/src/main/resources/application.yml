spring:
  application:
    name: nomenclator
  profiles:
    default: dev

server:
  port: 8082

keycloak:
  admin:
    url: http://localhost:8080
    realm: flowmanager
    client-id: flowmanager-client
    client-secret: ${KEYCLOAK_CLIENT_SECRET}

gateway:
  internal-secret: ${GATEWAY_SECRET}