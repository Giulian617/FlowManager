app = "flowmanager-api-gateway"
primary_region = "fra"

[build]

[env]
  SERVER_PORT = "8081"
  NOMENCLATOR_BASE_URL = "http://flowmanager-nomenclator.internal:8082"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI = "https://flowmanager-keycloak.fly.dev/realms/flowmanager"
  CORS_ALLOWED_ORIGINS = "https://flowmanager-frontend.fly.dev"
  MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT = "http://flowmanager-zipkin.internal:9411/api/v2/spans"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/actuator/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = 1024
