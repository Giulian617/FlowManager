server:
  port: 8081

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/flowmanager

gateway:
  internal-secret: ${GATEWAY_SECRET}

management:
  tracing:
    sampling:
      probability: 0.1
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: api-gateway

resilience4j:
  ratelimiter:
    rate-limiter-aspect-order: 0
    instances:
      nomenclator:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0ms
        register-health-indicator: true
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      nomenclator:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
  retry:
    retry-aspect-order: 2
    instances:
      nomenclator:
        max-attempts: 3
        wait-duration: 500ms
  timelimiter:
    instances:
      nomenclator:
        timeout-duration: 5s