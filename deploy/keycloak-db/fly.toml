app = "flowmanager-keycloak-db"
primary_region = "fra"

[build]
  image = "postgres:15"

[env]
  POSTGRES_DB = "keycloak"
  POSTGRES_USER = "keycloak-user"
  PGDATA = "/var/lib/postgresql/data/pgdata"

[mounts]
  source = "kc_pg"
  destination = "/var/lib/postgresql/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = 512

[checks]
  [checks.alive]
    type = "tcp"
    port = 5432
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
