app = "flowmanager-grafana"
primary_region = "fra"

[build]

[env]
  GF_PATHS_DATA = "/var/lib/grafana"

[mounts]
  source = "grafana_data"
  destination = "/var/lib/grafana"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = 512
